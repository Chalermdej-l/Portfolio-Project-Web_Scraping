[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-web-scraping"
version = "0.1.0"
description = "Booking.com hotel scraper: sitemap discovery, sharded page scraping, SQL Server load"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/config.py" = ["E501"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
